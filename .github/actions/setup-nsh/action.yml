name: Setup pinned Native Shell
description: Install the official NSH v0.6.1 distribution
runs:
  using: composite
  steps:
    - name: Install Linux runtime dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0
    - name: Install NSH on Unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        NSH_VERSION: v0.6.1
        NSH_INSTALL_DIR: ${{ runner.temp }}/nsh
      run: |
        curl -fsSL --retry 3 https://github.com/longbridge/nsh/releases/download/v0.6.1/install.sh -o "$RUNNER_TEMP/install-nsh.sh"
        sh "$RUNNER_TEMP/install-nsh.sh"
        echo "$NSH_INSTALL_DIR/bin" >> "$GITHUB_PATH"
    - name: Install NSH on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        NSH_VERSION: v0.6.1
        NSH_INSTALL_DIR: ${{ runner.temp }}/nsh
      run: |
        $ErrorActionPreference = 'Stop'
        $script = Join-Path $env:RUNNER_TEMP 'install-nsh.ps1'
        Invoke-WebRequest https://github.com/longbridge/nsh/releases/download/v0.6.1/install.ps1 -OutFile $script
        & $script
        if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        (Join-Path $env:NSH_INSTALL_DIR 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Verify pinned CLI
      shell: bash
      run: |
        nsh --version | tee nsh-version.log
        grep -E '0\.6\.1([[:space:]]|$)' nsh-version.log
