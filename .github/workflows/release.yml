name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nsh
      - run: nsh check
      - run: nsh build
      - run: nsh test
      - name: Verify tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version nsh.json)"
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            arch: x64
          - os: macos-15
            target: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nsh
      - shell: bash
        run: nsh package --target ${{ matrix.target }} -o dist
      - name: Archive packages
        shell: bash
        run: |
          mkdir -p release
          if [ "$RUNNER_OS" = "macOS" ]; then
            app="$(find dist -maxdepth 2 -name '*.app' -print -quit)"
            test -n "$app"
            ditto -c -k --sequesterRsrc --keepParent "$app" release/NSH-Studio-macos-arm64.zip
          else
            zip="$(find dist -maxdepth 2 -name '*.zip' -print -quit)"
            test -n "$zip"
            cp "$zip" release/NSH-Studio-windows-x64.zip
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --prerelease --notes "Pre-release: macOS package is ad hoc signed, not notarized. Windows package is unsigned."
